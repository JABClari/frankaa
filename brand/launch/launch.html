<!doctype html>
<!-- frankaa launch images. One page, one image per ?id=. render.mjs opens each at 2x and saves the PNG at its exact size.
     Pictures in src/ are crops of 3x screen recordings of the real docs site (Montage project frankaa, build/capture.mjs);
     the photos in them are CC0 (docs/photos/CREDITS.txt). -->
<html lang="en"><head><meta charset="utf-8"><title>frankaa launch images</title>
<style>
:root { --red: #C8322B; --gold: #E9B23A; --indigo: #23306B; --green: #1F6B4A; --cream: #F4EBDD; --ink: #16130F; --ink-2: #625a50; --ink-3: #978e83;
  --display: "Avenir Next", Futura, "Helvetica Neue", Arial, sans-serif; --sans: -apple-system, "Helvetica Neue", Arial, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--cream); color: var(--ink); -webkit-font-smoothing: antialiased; }
.c { position: relative; overflow: hidden; background: var(--cream); }
.brand { display: flex; align-items: center; gap: .32em; font: 700 1em/1 var(--display); letter-spacing: -.03em; }
.brand svg { width: 1.25em; height: 1.25em; }
h1 { margin: 0; font: 700 1em/1.06 var(--display); letter-spacing: -.032em; text-wrap: balance; }
.pill { display: inline-flex; align-items: center; gap: .55em; height: 2.3em; padding: 0 1.05em; border-radius: 999px; background: #fff; box-shadow: 0 1px 2px rgba(22,19,15,.05), 0 10px 26px -12px rgba(22,19,15,.18); font: 500 1em/1 var(--mono); white-space: nowrap; }
.pill span { color: var(--ink-3); }
.win { position: absolute; overflow: hidden; border-radius: 22px; background: #1b1814; box-shadow: 0 2px 4px rgba(22,19,15,.06), 0 30px 60px -30px rgba(22,19,15,.45); }
.win img { display: block; width: 100%; height: 100%; object-fit: cover; }
.tag { position: absolute; left: 14px; top: 14px; padding: 7px 12px; border-radius: 999px; background: rgba(22,19,15,.8); color: var(--cream); font: 600 15px/1 var(--sans); }
.code { position: absolute; border-radius: 24px; background: #fff; box-shadow: 0 2px 4px rgba(22,19,15,.05), 0 30px 60px -30px rgba(22,19,15,.35); font: 500 1em/1.85 var(--mono); padding: 1.3em 1.7em; white-space: pre; }
.k { color: var(--indigo); } .s { color: var(--green); } .f { color: var(--red); } .p { color: var(--ink-3); }
/* phone: light bezel, as in the film */
.phone { position: absolute; border-radius: 46px; padding: 11px; background: linear-gradient(135deg, #f4f5f8, #e3e5ec); box-shadow: 0 0 0 1px rgba(16,24,40,.08), 0 40px 80px -30px rgba(22,19,15,.45); }
.phone .scr { position: relative; border-radius: 36px; overflow: hidden; background: #141412; }
.phone .sb { height: 44px; background: #1b1b1d; color: #fff; font: 600 15px/44px var(--sans); padding-left: 44px; }
.phone img { display: block; width: 100%; }
.thumb-mark svg { width: 100%; height: 100%; }
</style></head>
<body>
<template id="mark"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 8h48v40l-8 8-8-8-8 8-8-8-8 8-8-8z" fill="#23306B"/><rect x="16" y="16" width="32" height="22" rx="3" fill="#F4EBDD"/><circle cx="26" cy="25" r="4.5" fill="#E9B23A"/><path d="M18 36l9-8 6 5 5-4 8 7z" fill="#C8322B"/></svg></template>
<div id="root"></div>
<script>
const id = new URLSearchParams(location.search).get('id') || 'og';
const MARK = document.getElementById('mark').innerHTML;
const HERO = 'An image gallery library that makes pictures move like the real thing.';
const brand = (px) => `<div class="brand" style="font-size:${px}px">${MARK}frankaa</div>`;
const pill = (px) => `<div class="pill" style="font-size:${px}px"><span>$</span>npm install frankaa</div>`;
const win = (src, x, y, w, h, extra = '') => `<div class="win" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${extra}<img src="src/${src}" alt=""></div>`;
const abs = (x, y, html, w) => `<div style="position:absolute;left:${x}px;top:${y}px;${w ? 'width:' + w + 'px' : ''}">${html}</div>`;
// split: brand, the line and the install pill on the left; the lightbox mid-effect (cloth unfurl) on the right
const split = (W, H, k, hs = 52 * k, vf = .5) => {
  const m = Math.round(64 * k), vw = Math.round(W * vf), vh = Math.round(H - m * 2), tx = m, colW = W - vw - m * 2 - Math.round(48 * k);
  return { W, H, html:
    abs(tx, m, brand(Math.round(34 * k))) +
    abs(tx, Math.round(H * .27), `<h1 style="font-size:${Math.round(hs)}px">${HERO}</h1>`, colW) +
    abs(tx, H - m - Math.round(46 * k), pill(Math.round(20 * k))) +
    win('fx-cloth-74.jpg', W - vw - m, m, vw, vh) };
};
const CODE = `<span class="k">import</span> { unfurl } <span class="k">from</span> <span class="s">"frankaa"</span><span class="p">;</span>
<span class="k">import</span> <span class="s">"frankaa/style.css"</span><span class="p">;</span>
<span class="f">unfurl</span>(items, { origin: (n) <span class="k">=&gt;</span> thumbs[n] })<span class="p">;</span>`;
const L = {
  og: () => split(1200, 630, 1),
  github: () => split(1280, 640, 1.04),
  x: () => split(1600, 900, 1.36, 62, .47),
  square: () => ({ W: 1080, H: 1080, html:
    abs(72, 72, brand(40)) + abs(72, 160, `<h1 style="font-size:66px">${HERO}</h1>`, 900) +
    win('fx-mosaic-72.jpg', 72, 440, 936, 468) + abs(72, 950, pill(22)) }),
  // Product Hunt gallery, 1270 x 760: one heading each, centred over its picture
  ph1: () => ({ W: 1270, H: 760, ...split(1270, 760, 1.12, 52, .48) }),
  ph2: () => { const g = 20, w = (1270 - 120 - g * 2) / 3, h = w * .75;
    return { W: 1270, H: 760, html: abs(60, 64, `<h1 style="font-size:58px;text-align:center">A slider, a lightbox and a strip.</h1>`, 1150) +
      win('slider-5.jpg', 60, 250, w, h, '<span class="tag">procession</span>') + win('strip-40.jpg', 60 + w + g, 250, w, h, '<span class="tag">unfurl</span>') +
      win('drum-60.jpg', 60 + (w + g) * 2, 250, w, h, '<span class="tag">drumline</span>') + abs(60, 620, `<div style="display:flex;justify-content:center">${pill(20)}</div>`, 1150) }; },
  ph3: () => { const g = 16, w = (1270 - 120 - g) / 2, h = (760 - 200 - 60 - g) / 2;
    return { W: 1270, H: 760, html: abs(60, 60, `<h1 style="font-size:54px;text-align:center">Swipe, and the effect follows your finger.</h1>`, 1150) +
      [['lb-swipe-80.jpg', 'Displacement'], ['fx-ripple-70.jpg', 'Ripple'], ['fx-cloth-74.jpg', 'Cloth unfurl'], ['fx-mosaic-72.jpg', 'Mosaic']].map(([s, t], i) => win(s, 60 + (i % 2) * (w + g), 200 + Math.floor(i / 2) * (h + g), w, h, `<span class="tag">${t}</span>`)).join('') }; },
  ph4: () => ({ W: 1270, H: 760, html: abs(80, 250, `<h1 style="font-size:64px">Just as smooth under a thumb.</h1>`, 560) + abs(80, 470, brand(30)) +
      `<div class="phone" style="left:790px;top:56px;width:312px"><div class="scr"><div class="sb">9:41</div><img src="src/phone-70.jpg" alt=""></div></div>` }),
  ph5: () => ({ W: 1270, H: 760, html: abs(60, 110, `<h1 style="font-size:64px;text-align:center">Zero dependencies. Three lines.</h1>`, 1150) +
      abs(60, 260, `<div style="display:flex;justify-content:center">${pill(24)}</div>`, 1150) +
      `<div class="code" style="left:50%;top:380px;transform:translateX(-50%);font-size:24px">${CODE}</div>` }),
  thumb: () => ({ W: 240, H: 240, html: `<div class="thumb-mark" style="position:absolute;left:36px;top:30px;width:168px;height:168px">${MARK}</div>` }),
};
const o = L[id]();
const root = document.getElementById('root');
root.className = 'c'; root.style.width = o.W + 'px'; root.style.height = o.H + 'px'; root.innerHTML = o.html;
window.READY = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]).then(() => ({ W: o.W, H: o.H }));
</script>
</body></html>
